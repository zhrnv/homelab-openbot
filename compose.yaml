services:
  openbot:
    image: ghcr.io/nightly-labs/openbot:0.63.0
    container_name: openbot
    restart: unless-stopped
    security_opt:
      - seccomp=./seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    volumes:
      - /DATA/AppData/openbot/data:/data
