services:
  openbot:
    image: ghcr.io/nightly-labs/openbot:0.63.0
    container_name: openbot
    restart: unless-stopped
    security_opt:
      - seccomp=./seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /DATA/AppData/openbot/data:/data
      - /DATA/Vida:/vida

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1300"
